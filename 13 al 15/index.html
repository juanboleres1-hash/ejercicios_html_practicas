<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>13 al 15</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="contenedor-principal">

    <section class="tarjeta-ejercicio">
      <h2>13. Botones con variantes de estilo</h2>
      <div class="contenedor-botones">
        <button class="boton boton-primario">Aceptar</button>
        <button class="boton boton-secundario">Cancelar</button>
        <button class="boton boton-peligro">Eliminar</button>
      </div>
    </section>

    <section class="tarjeta-ejercicio">
      <h2>14. Imagen con texto superpuesto</h2>
      <div class="contenedor-imagen">
        <img src="comida2.jpeg" alt="Imagen de muestra">
        <div class="texto-superpuesto">
          <h2>Hosteria DiFrancesco</h2>
          <p>Pasta lenguini a la Bolognesa y una coca cola</p>
        </div>
      </div>
    </section>

    <section class="tarjeta-ejercicio">
      <h2>15. Formulario en dos columnas</h2>
      <form class="formulario-grid">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Tu nombre">
        </div>

        <div class="campo">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" placeholder="Tu apellido">
        </div>

        <div class="campo">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="correo@ejemplo.com">
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" placeholder="12345678">
        </div>

        <div class="campo campo-completo">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje..."></textarea>
        </div>

        <div class="campo campo-completo">
          <button type="submit" class="boton boton-primario">Enviar Formulario</button>
        </div>
      </form>
    </section>

  </main>

</body>
</html>
