<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trío de Tarjetas</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="cards-wrapper">
    
   
    <div class="card">
      <div class="card-img-box">
        <img src="Arcteryx.jpeg" alt="Servicio 1">
      </div>
      <div class="card-body">
        <h3>Arcteryx</h3>
        <p>Primer Lugar Liga de Volleyball Antigua 2025/2026</p>
        <button>Mas Informacion</button>
      </div>
    </div>

 
    <div class="card featured">
      <div class="card-img-box">
        <span class="badge">Reciente</span>
        <img src="Bolostars.jpeg" alt="Servicio 2">
      </div>
      <div class="card-body">
        <h3>Bolostars</h3>
        <p>Primer lugar Liga Municipal de Ciudad Vieja 2026</p>
        <button>Mas Informacion</button>
      </div>
    </div>

    
    <div class="card">
      <div class="card-img-box">
        <img src="Camila.jpeg" alt="Servicio 3">
      </div>
      <div class="card-body">
        <h3>Camila</h3>
        <p>Tercer Lugar Liga de Volleyball Antigua 2024/2025</p>
        <button>Mas Informacion</button>
      </div>
    </div>

  </div>

</body>
</html>
