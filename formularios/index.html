<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <link rel="stylesheet" href="styles.css" />
        
    </head>
    <body>
        
        <h1>Formulario</h1>
        
       
<div class="page-wrapper">
  <div class="form-card">
    <form class="form-container">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escriba su nombre" required>
      </div>

      <div class="form-group">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" placeholder="Usuario@gmail.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Contraseña123" required>
      </div>

      <button type="submit" class="nav-btn">Enviar</button>
    </form>
  </div>
</div>
    </body>
</html>
